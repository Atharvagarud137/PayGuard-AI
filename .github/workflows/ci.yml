name: PayGuard-AI CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payguard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python Unit and API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: payguard_test
          POSTGRES_USER: payguard
          POSTGRES_PASSWORD: payguard_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payguard -d payguard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://payguard:payguard_test_password@localhost:5432/payguard_test
      PAYGUARD_ENV: test
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: |
          python -m compileall -q app tests

      - name: Validate Alembic migration configuration
        run: |
          alembic heads
          alembic history

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run unit and API tests
        run: pytest tests/unit tests/api -v --tb=short

  e2e-tests:
    name: Dashboard End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: payguard_test
          POSTGRES_USER: payguard
          POSTGRES_PASSWORD: payguard_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payguard -d payguard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://payguard:payguard_test_password@localhost:5432/payguard_test
      PAYGUARD_ENV: test
      PAYGUARD_ENABLE_TEST_ENDPOINTS: "true"
      PAYGUARD_TEST_RESET_TOKEN: payguard-test-reset-token-2026-phase4
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Start backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &

      - name: Start dashboard
        working-directory: dashboard
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > ../frontend.log 2>&1 &

      - name: Wait for application services
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null \
              && curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo "Backend or dashboard did not become ready."
          cat backend.log || true
          cat frontend.log || true
          exit 1

      - name: Run Playwright E2E tests
        run: pytest tests/e2e -v --tb=short


  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Audit dashboard dependencies
        working-directory: dashboard
        run: npm audit --audit-level=high
